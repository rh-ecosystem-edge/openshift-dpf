name: Release build

on:
  workflow_call:
    inputs:
      source_ref:
        description: Git tag to build from NVIDIA/doca-platform
        required: true
        type: string
      release_version:
        description: SemVer numeric prefix (e.g. 26.4.0)
        required: true
        type: string
      release_channel:
        description: Prerelease channel (e.g. stable)
        required: true
        type: string
      dry_run:
        description: Build only, skip push
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  SOURCE_REPO: https://github.com/NVIDIA/doca-platform.git
  REGISTRY: quay.io/edge-infrastructure/doca-platform
  HELM_REGISTRY: oci://quay.io/edge-infrastructure/doca-platform/charts
  UPSTREAM_REGISTRY: quay.io/edge-infrastructure/doca-platform
  CONTAINER_TOOL: docker
  RELEASE_VERSION: ${{ inputs.release_version }}
  RELEASE_CHANNEL: ${{ inputs.release_channel }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PACKAGE_SOURCES: "false"
    defaults:
      run:
        working-directory: source
    steps:
      - name: Clone source repository
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          git clone "${{ env.SOURCE_REPO }}" "$GITHUB_WORKSPACE/source"
          cd "$GITHUB_WORKSPACE/source"
          git checkout "${SOURCE_REF}"
        working-directory: ${{ github.workspace }}

      - name: Patch hostdriver MFT download retry
        run: |
          python3 - <<'PY'
          from pathlib import Path

          dockerfile = Path("source/Dockerfile.hostdriver")
          if not dockerfile.exists():
              print("Dockerfile.hostdriver not found; skipping MFT patch")
              raise SystemExit(0)

          contents = dockerfile.read_text()

          old = '''RUN case ${TARGETARCH} in \\
                  amd64) ARCH=x86_64 ;; \\
                  arm64) ARCH=arm64 ;; \\
                  *) echo "Unsupported architecture: ${TARGETARCH}" && exit 1 ;; \\
              esac && \\
              curl -fsSL https://www.mellanox.com/downloads/MFT/mft-${MFT_VERSION}-${ARCH}-deb.tgz | tar -xz -C /tmp && \\
              cd /tmp/mft-${MFT_VERSION}-${ARCH}-deb && \\
              ./install.sh --without-kernel'''

          new = '''RUN case ${TARGETARCH} in \\
                  amd64) ARCH=x86_64 ;; \\
                  arm64) ARCH=arm64 ;; \\
                  *) echo "Unsupported architecture: ${TARGETARCH}" && exit 1 ;; \\
              esac && \\
              curl -fL --retry 5 --retry-delay 5 --retry-all-errors \\
                  --connect-timeout 30 --max-time 900 \\
                  -o /tmp/mft.tgz \\
                  https://www.mellanox.com/downloads/MFT/mft-${MFT_VERSION}-${ARCH}-deb.tgz && \\
              gzip -t /tmp/mft.tgz && \\
              tar -xzf /tmp/mft.tgz -C /tmp && \\
              cd /tmp/mft-${MFT_VERSION}-${ARCH}-deb && \\
              ./install.sh --without-kernel && \\
              rm -rf /tmp/mft.tgz /tmp/mft-${MFT_VERSION}-${ARCH}-deb'''

          if old not in contents:
              print("expected MFT curl block not found; skipping patch")
              raise SystemExit(0)

          dockerfile.write_text(contents.replace(old, new))
          print("patched Dockerfile.hostdriver MFT download")
          PY
        working-directory: ${{ github.workspace }}

      - name: Resolve tag
        run: |
          TAG="${RELEASE_VERSION}-${RELEASE_CHANNEL}"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"

      - name: Verify checkout
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          echo "Repository : ${{ env.SOURCE_REPO }}"
          echo "Ref        : ${SOURCE_REF}"
          echo "Tag        : ${{ env.TAG }}"
          echo "Commit     : $(git rev-parse HEAD)"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: source/go.mod
          cache-dependency-path: source/go.sum

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,amd64
          image: tonistiigi/binfmt:qemu-v10.2.3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - name: Log in to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Cache build tools and cloned repos
        uses: actions/cache@v4
        with:
          path: |
            source/hack/tools/bin
            source/hack/repos
          key: release-tools-${{ runner.os }}-${{ hashFiles('source/hack/tools/tools.mk') }}
          restore-keys: |
            release-tools-${{ runner.os }}-

      - name: Build and push release
        if: ${{ !inputs.dry_run }}
        run: make release

      - name: Build only (dry run)
        if: ${{ inputs.dry_run }}
        run: make release-build

      - name: Summary
        if: always()
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          DRY="${DRY_RUN}"
          echo "## Release ${{ env.TAG }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Source: \`${{ env.SOURCE_REPO }}\` @ \`${SOURCE_REF}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`$(git rev-parse HEAD)\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$DRY" == "true" ]]; then
            echo "> **Dry run**: images and charts were built but NOT pushed." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "### Container images" >> "$GITHUB_STEP_SUMMARY"
          echo "Tag: \`${{ env.REGISTRY }}/*:${{ env.TAG }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Helm charts" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$DRY" != "true" ]]; then
            echo "Pushed to \`${{ env.HELM_REGISTRY }}\` as \`${{ env.TAG }}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Built as \`${{ env.TAG }}\` (not pushed)" >> "$GITHUB_STEP_SUMMARY"
          fi
          ls -1 hack/charts/*.tgz 2>/dev/null | while read f; do
            echo "- \`$(basename "$f")\`" >> "$GITHUB_STEP_SUMMARY"
          done
