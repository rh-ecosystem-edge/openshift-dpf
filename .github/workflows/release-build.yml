name: Release build

on:
  workflow_call:
    inputs:
      source_ref:
        description: Git ref to build from NVIDIA/doca-platform
        required: true
        type: string
      release_version:
        description: SemVer numeric prefix (e.g. 26.4.2 or 0.0.0). Bare GA versions are reserved for the other repo.
        required: true
        type: string
      release_channel:
        description: Prerelease channel (e.g. beta, dev-stable)
        required: true
        type: string
      floating_tag:
        description: Mutable channel pointer. Defaults to <release_version>-<release_channel>.
        required: false
        type: string
        default: ""
      tag:
        description: Immutable prerelease override (must be <version>-<channel>.<id>)
        required: false
        type: string
        default: ""
      dry_run:
        description: Build only, skip push and retag
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ inputs.release_version }}-${{ inputs.release_channel }}
  cancel-in-progress: false

env:
  SOURCE_REPO: https://github.com/NVIDIA/doca-platform.git
  REGISTRY: ghcr.io/souleb/doca-platform
  HELM_REGISTRY: oci://ghcr.io/souleb/doca-platform/charts
  CONTAINER_TOOL: docker
  RELEASE_VERSION: ${{ inputs.release_version }}
  RELEASE_CHANNEL: ${{ inputs.release_channel }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      UPSTREAM_REGISTRY: ghcr.io/souleb/doca-platform
      PACKAGE_SOURCES: "false"
    defaults:
      run:
        working-directory: source
    steps:
      - name: Clone source repository
        run: |
          git clone "${{ env.SOURCE_REPO }}" "$GITHUB_WORKSPACE/source"
          cd "$GITHUB_WORKSPACE/source"
          git checkout "${{ inputs.source_ref }}"
        working-directory: ${{ github.workspace }}

      - name: Patch hostdriver MFT download retry
        run: |
          python3 - <<'PY'
          from pathlib import Path

          dockerfile = Path("source/Dockerfile.hostdriver")
          if not dockerfile.exists():
              print("Dockerfile.hostdriver not found; skipping MFT patch")
              raise SystemExit(0)

          contents = dockerfile.read_text()

          old = '''RUN case ${TARGETARCH} in \\
                  amd64) ARCH=x86_64 ;; \\
                  arm64) ARCH=arm64 ;; \\
                  *) echo "Unsupported architecture: ${TARGETARCH}" && exit 1 ;; \\
              esac && \\
              curl -fsSL https://www.mellanox.com/downloads/MFT/mft-${MFT_VERSION}-${ARCH}-deb.tgz | tar -xz -C /tmp && \\
              cd /tmp/mft-${MFT_VERSION}-${ARCH}-deb && \\
              ./install.sh --without-kernel'''

          new = '''RUN case ${TARGETARCH} in \\
                  amd64) ARCH=x86_64 ;; \\
                  arm64) ARCH=arm64 ;; \\
                  *) echo "Unsupported architecture: ${TARGETARCH}" && exit 1 ;; \\
              esac && \\
              curl -fL --retry 5 --retry-delay 5 --retry-all-errors \\
                  --connect-timeout 30 --max-time 900 \\
                  -o /tmp/mft.tgz \\
                  https://www.mellanox.com/downloads/MFT/mft-${MFT_VERSION}-${ARCH}-deb.tgz && \\
              gzip -t /tmp/mft.tgz && \\
              tar -xzf /tmp/mft.tgz -C /tmp && \\
              cd /tmp/mft-${MFT_VERSION}-${ARCH}-deb && \\
              ./install.sh --without-kernel && \\
              rm -rf /tmp/mft.tgz /tmp/mft-${MFT_VERSION}-${ARCH}-deb'''

          if old not in contents:
              print("expected MFT curl block not found; skipping patch")
              raise SystemExit(0)

          dockerfile.write_text(contents.replace(old, new))
          print("patched Dockerfile.hostdriver MFT download")
          PY
        working-directory: ${{ github.workspace }}

      - name: Resolve tag
        run: |
          IMMUTABLE_PREFIX="${RELEASE_VERSION}-${RELEASE_CHANNEL}"
          FLOATING_TAG="${{ inputs.floating_tag }}"
          if [[ -z "${FLOATING_TAG}" ]]; then
            FLOATING_TAG="${IMMUTABLE_PREFIX}"
          fi
          echo "IMMUTABLE_PREFIX=${IMMUTABLE_PREFIX}" >> "$GITHUB_ENV"
          echo "FLOATING_TAG=${FLOATING_TAG}" >> "$GITHUB_ENV"

          VER_RE="${RELEASE_VERSION//./\\.}"
          CHAN_RE="${RELEASE_CHANNEL//./\\.}"
          ALLOWED="^${VER_RE}-${CHAN_RE}\\.[A-Za-z0-9][A-Za-z0-9.-]*$"

          INPUT_TAG="${{ inputs.tag }}"
          if [[ -n "${INPUT_TAG}" ]]; then
            if [[ ! "${INPUT_TAG}" =~ ${ALLOWED} ]]; then
              echo "::error::tag must be ${IMMUTABLE_PREFIX}.<id> (e.g. ${IMMUTABLE_PREFIX}.1 or ${IMMUTABLE_PREFIX}.<sha>)."
              echo "::error::Do not use a bare GA version — those are published from a different repository."
              exit 1
            fi
            echo "TAG=${INPUT_TAG}" >> "$GITHUB_ENV"
          else
            SHORT_SHA=$(git rev-parse --short HEAD)
            echo "TAG=${IMMUTABLE_PREFIX}.${SHORT_SHA}" >> "$GITHUB_ENV"
          fi

      - name: Verify checkout
        run: |
          echo "Repository : ${{ env.SOURCE_REPO }}"
          echo "Ref        : ${{ inputs.source_ref }}"
          echo "Tag        : ${{ env.TAG }}"
          echo "Channel    : ${{ env.FLOATING_TAG }}"
          echo "Commit     : $(git rev-parse HEAD)"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: source/go.mod
          cache-dependency-path: source/go.sum

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,amd64
          image: tonistiigi/binfmt:qemu-v10.2.3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache build tools and cloned repos
        uses: actions/cache@v4
        with:
          path: |
            source/hack/tools/bin
            source/hack/repos
          key: release-tools-${{ runner.os }}-${{ hashFiles('source/hack/tools/tools.mk') }}
          restore-keys: |
            release-tools-${{ runner.os }}-

      - name: Build and push release
        if: ${{ !inputs.dry_run }}
        run: make release

      - name: Retag as floating channel
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          if [[ "${TAG}" == "${FLOATING_TAG}" ]]; then
            echo "Build tag is already ${FLOATING_TAG}; nothing to retag."
            exit 0
          fi

          MANIFEST="artifacts/release-manifest.yaml"
          if [[ ! -f "${MANIFEST}" ]]; then
            echo "::error::${MANIFEST} not found; cannot retag to ${FLOATING_TAG}"
            exit 1
          fi

          echo "Pointing ${FLOATING_TAG} at ${TAG}"
          suffix=":${TAG}"
          while IFS= read -r ref; do
            [[ -z "${ref}" ]] && continue
            src="${ref#oci://}"
            if [[ "${src}" != *"${suffix}" ]]; then
              echo "Skipping ${src} (does not end with ${suffix})"
              continue
            fi
            dest="${src%"${suffix}"}:${FLOATING_TAG}"
            echo "Retag ${src} -> ${dest}"
            docker buildx imagetools create --tag "${dest}" "${src}"
          done < <(awk '/^[[:space:]]*ref:[[:space:]]/ { print $2 }' "${MANIFEST}")

      - name: Build only (dry run)
        if: ${{ inputs.dry_run }}
        run: make release-build

      - name: Summary
        if: always()
        run: |
          DRY="${{ inputs.dry_run }}"
          echo "## Release ${{ env.TAG }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Source: \`${{ env.SOURCE_REPO }}\` @ \`${{ inputs.source_ref }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`$(git rev-parse HEAD)\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$DRY" == "true" ]]; then
            echo "> **Dry run** — images and charts were built but NOT pushed." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "### Container images" >> "$GITHUB_STEP_SUMMARY"
          echo "Immutable tag: \`${{ env.REGISTRY }}/*:${{ env.TAG }}\`" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$DRY" != "true" ]]; then
            echo "Floating channel: \`${{ env.REGISTRY }}/*:${{ env.FLOATING_TAG }}\`" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Helm charts" >> "$GITHUB_STEP_SUMMARY"
          echo "Pushed to \`${{ env.HELM_REGISTRY }}\` as \`${{ env.TAG }}\`" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$DRY" != "true" ]]; then
            echo "Floating OCI tag: \`${{ env.FLOATING_TAG }}\` (use \`helm pull … --version ${{ env.FLOATING_TAG }}\`)" >> "$GITHUB_STEP_SUMMARY"
          fi
          ls -1 hack/charts/*.tgz 2>/dev/null | while read f; do
            echo "- \`$(basename "$f")\`" >> "$GITHUB_STEP_SUMMARY"
          done
