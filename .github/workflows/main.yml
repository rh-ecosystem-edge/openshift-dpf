name: Release

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: "Which channel to build (schedule always builds all)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - beta-26.4
          - beta-26.8
          - dev-stable
      ref:
        description: "Override git ref (empty = channel default). Do not set when building all channels."
        required: false
        default: ""
        type: string
      tag:
        description: "Immutable prerelease override for a single channel (e.g. 26.4.2-beta.1, 26.8.0-beta.1, or 0.0.0-dev-stable.1). Ignored when channel is all."
        required: false
        default: ""
        type: string
      dry_run:
        description: "Dry run — build only, skip push"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  beta-26-4:
    if: ${{ github.event_name == 'schedule' || inputs.channel == 'all' || inputs.channel == 'beta-26.4' }}
    uses: ./.github/workflows/release-build.yml
    with:
      source_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || 'public-release-v26.4' }}
      release_version: "26.4.2"
      release_channel: "beta"
      tag: ${{ (github.event_name == 'workflow_dispatch' && inputs.channel == 'beta-26.4' && inputs.tag) || '' }}
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
    secrets: inherit

  beta-26-8:
    if: ${{ github.event_name == 'schedule' || inputs.channel == 'all' || inputs.channel == 'beta-26.8' }}
    uses: ./.github/workflows/release-build.yml
    with:
      source_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || 'public-release-v26.8' }}
      release_version: "26.8.0"
      release_channel: "beta"
      tag: ${{ (github.event_name == 'workflow_dispatch' && inputs.channel == 'beta-26.8' && inputs.tag) || '' }}
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
    secrets: inherit

  dev-stable:
    if: ${{ github.event_name == 'schedule' || inputs.channel == 'all' || inputs.channel == 'dev-stable' }}
    uses: ./.github/workflows/release-build.yml
    with:
      source_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || 'public-main' }}
      release_version: "0.0.0"
      release_channel: "dev-stable"
      floating_tag: "dev-stable"
      tag: ${{ (github.event_name == 'workflow_dispatch' && inputs.channel == 'dev-stable' && inputs.tag) || '' }}
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
    secrets: inherit
