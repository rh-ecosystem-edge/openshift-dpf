# Fluent Bit receives DOCA Argus telemetry (TCP JSON) and forwards only
# CRITICAL and HIGH alerts to Loki. Everything else is dropped in memory.
# There is no filesystem buffer, so a Loki outage drops alerts instead of
# spooling them to the node's disk.
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: argus-logs
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush            2
        Log_Level        warn
        HTTP_Server      On
        HTTP_Listen      0.0.0.0
        HTTP_Port        2020
        Health_Check     On

    [INPUT]
        Name             tcp
        Tag              argus
        Listen           0.0.0.0
        Port             24224
        Format           json
        Chunk_Size       512k
        Buffer_Size      4M
        Mem_Buf_Limit    64MB
        storage.type     memory

    [FILTER]
        Name             grep
        Match            argus
        Regex            message_type ^ALERT$

    [FILTER]
        Name             grep
        Match            argus
        Regex            severity ^(CRITICAL|HIGH)$

    [OUTPUT]
        Name             loki
        Match            argus
        Host             loki.argus-logs.svc
        Port             3100
        Labels           job=argus, severity=$severity, event=$activity_data['name'], host=$workload_information['hostname']
        Line_Format      json
        Retry_Limit      2
---
apiVersion: v1
kind: Service
metadata:
  name: fluent-bit
  namespace: argus-logs
spec:
  type: NodePort
  selector:
    app: fluent-bit
  ports:
    - name: argus-telemetry
      port: 24224
      targetPort: 24224
      nodePort: <ARGUS_TELEMETRY_NODE_PORT>
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluent-bit
  namespace: argus-logs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fluent-bit
  template:
    metadata:
      labels:
        app: fluent-bit
    spec:
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fluent-bit
          image: docker.io/fluent/fluent-bit:5.1.3
          ports:
            - containerPort: 24224
              name: argus-telemetry
            - containerPort: 2020
              name: http
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 2020
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /fluent-bit/etc/fluent-bit.conf
              subPath: fluent-bit.conf
      volumes:
        - name: config
          configMap:
            name: fluent-bit-config
