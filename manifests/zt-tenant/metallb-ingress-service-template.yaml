# LoadBalancer front end for the tenant cluster's default ingress controller.
# HyperShift publishes the tenant ingress with HostNetwork, so the router pods
# own ports 80/443 on the worker; this Service selects them and MetalLB
# advertises the VIP for it on the tenant worker's L2 segment.
apiVersion: v1
kind: Service
metadata:
  name: metallb-ingress
  namespace: openshift-ingress
  annotations:
    metallb.universe.tf/address-pool: <METALLB_POOL_NAME>
spec:
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 80
  - name: https
    protocol: TCP
    port: 443
    targetPort: 443
  selector:
    ingresscontroller.operator.openshift.io/deployment-ingresscontroller: default
  type: LoadBalancer
