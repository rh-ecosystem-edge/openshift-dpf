# RHCOS layer with Kata 4.1.0-3 and DPU cold-plug VFIO support.
# The layer also supplies the CRI-O handler, kata config, and vfio-pci module
# configuration; do not add a separate cold-plug MachineConfig.
#
# This default image is for OpenShift 4.22 x86_64. Custom images must be built
# from the matching cluster RHCOS release or MCO can downgrade workers.
apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  labels:
    machineconfiguration.openshift.io/role: <KATA_MC_ROLE>
  name: 99-kata-dpu-layered
spec:
  osImageURL: <KATA_RHCOS_LAYER_IMAGE>
