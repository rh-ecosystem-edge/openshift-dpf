# Smoke-test pod for DPU kata cold-plug validation.
# Matches jensfr/rhcos-layer-kata-dpu 05-test-pod.yaml (single kata VF pool).
#
# Prerequisites: make enable-kata, make enable-ovn-injector, PF1 kata VF pool ready.
# The OVN injector webhook must set v1.multus-cni.io/default-network to the kata
# NAD (dpf-ovn-kubernetes-kata-coldplug) so CNI uses the VF netdev path, not
# ovn-primary with a stale/vfio VF PCI.
apiVersion: v1
kind: Pod
metadata:
  name: kata-dpu-test
spec:
  runtimeClassName: <KATA_RUNTIME_CLASS>
  nodeSelector:
    node-role.kubernetes.io/<WORKER_ROLE>: ""
  containers:
  - name: test
    image: registry.access.redhat.com/ubi9/ubi-minimal:latest
    command: ["sleep", "300"]
    resources:
      limits:
        "<KATA_INJECTOR_RESOURCE_NAME>": "1"
      requests:
        "<KATA_INJECTOR_RESOURCE_NAME>": "1"
