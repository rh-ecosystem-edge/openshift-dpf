# IOMMU kargs for VFIO cold-plug. intel_iommu=on is required (Intel VT-d is
# off by default). amd_iommu=on is not a valid kernel parameter; AMD-Vi is
# on unless amd_iommu=off. iommu=pt is vendor-neutral passthrough mode.
#
# Role worker-dpu (the DPU host pool). Confirm: cat /proc/cmdline | grep iommu
apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  labels:
    machineconfiguration.openshift.io/role: <KATA_MC_ROLE>
  name: 99-iommu-enable
spec:
  kernelArguments:
    - intel_iommu=on
    - iommu=pt
