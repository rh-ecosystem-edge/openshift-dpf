# Single MachineConfig for Kata DPU cold-plug on the existing worker-dpu
# (or worker on SNO) MCP — not kata-oc.
#
# Combines CRI-O/kata config, IOMMU kargs, and optional RHCOS layer
# (osImageURL). The layer MUST match the cluster RHCOS digest or MCO will
# fail / drift. KATA_SKIP_RHCOS_LAYER=true leaves osImageURL unset (z-stream
# kata-containers 3.31.0-5+ already on the node).
apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  labels:
    machineconfiguration.openshift.io/role: <WORKER_ROLE>
  name: 99-kata-dpu
spec:
  <KATA_OS_IMAGE_URL>
  kernelArguments:
    - intel_iommu=on
    - iommu=pt
  config:
    ignition:
      version: 3.2.0
    storage:
      files:
      - path: /etc/crio/crio.conf.d/50-kata-coldplug
        mode: 0644
        overwrite: true
        contents:
          source: data:text/plain;charset=utf-8;base64,
      - path: /etc/kata-containers/config.d/50-coldplug.toml
        mode: 0644
        overwrite: true
        contents:
          source: data:text/plain;charset=utf-8;base64,W2h5cGVydmlzb3IucWVtdV0KY29sZF9wbHVnX3ZmaW8gPSAicm9vdC1wb3J0Igpob3RfcGx1Z192ZmlvID0gIm5vLXBvcnQiCnBjaWVfcm9vdF9wb3J0ID0gMgoKW3J1bnRpbWVdCnZmaW9fbW9kZSA9ICJndWVzdC1rZXJuZWwiCnN0YXRpY19zYW5kYm94X3Jlc291cmNlX21nbXQgPSB0cnVlCnNhbmRib3hfY2dyb3VwX29ubHkgPSB0cnVlCg==
