# RuntimeClass for DPU VFIO cold-plug. The RHCOS layer provides the matching
# CRI-O handler. This RuntimeClass schedules only to worker-dpu nodes.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: <KATA_RUNTIME_CLASS>
handler: kata-coldplug
overhead:
  podFixed:
    memory: "350Mi"
    cpu: "250m"
scheduling:
  nodeSelector:
    node-role.kubernetes.io/<WORKER_ROLE>: ""
