# RuntimeClass for DPU VFIO cold-plug. handler matches metadata.name and the
# CRI-O runtime in 04-kata-coldplug.yaml. nodeSelector is worker-dpu.
# Never select kata-oc: DPU nodes must not get that node-role.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: <KATA_RUNTIME_CLASS>
handler: <KATA_RUNTIME_CLASS>
overhead:
  podFixed:
    memory: "350Mi"
    cpu: "250m"
scheduling:
  nodeSelector:
    node-role.kubernetes.io/<WORKER_ROLE>: ""
