# RuntimeClass for DPU VFIO cold-plug. handler matches metadata.name and the
# CRI-O runtime defined in 02-kata-machineconfig.yaml. Created by enable-kata
# when missing.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: <KATA_RUNTIME_CLASS>
handler: <KATA_RUNTIME_CLASS>
overhead:
  podFixed:
    memory: "350Mi"
    cpu: "250m"
scheduling:
  nodeSelector:
    node-role.kubernetes.io/<WORKER_ROLE>: ""
