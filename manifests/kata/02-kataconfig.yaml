# KataConfig targeting worker-dpu (or worker on SNO). Pair with
# 01b-feature-gate.yaml so OSC uses DaemonSet install and does not create
# MCP kata-oc. Do not add node-role.kubernetes.io/kata-oc to DPU hosts.
apiVersion: kataconfiguration.openshift.io/v1
kind: KataConfig
metadata:
  name: example-kataconfig
spec:
  enablePeerPods: false
  logLevel: info
  kataConfigPoolSelector:
    matchLabels:
      node-role.kubernetes.io/<KATA_MC_ROLE>: ""
