# Restore the packaged CRI-O handler to active /etc when an upgraded node's
# persisted etc state hides the RPM's vendor copy under /usr/etc. Applied only
# when enable-kata detects that condition.
apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  labels:
    machineconfiguration.openshift.io/role: <KATA_MC_ROLE>
  name: 50-kata-coldplug-handler
spec:
  config:
    ignition:
      version: 3.2.0
    storage:
      files:
      - path: /etc/crio/crio.conf.d/50-kata-coldplug
        mode: 0644
        overwrite: true
        contents:
          source: data:text/plain;charset=utf-8;base64,
