apiVersion: operator.dpu.nvidia.com/v1alpha1
kind: DPFOperatorConfig
metadata:
  name: dpfoperatorconfig
  namespace: dpf-operator-system
spec:
  deploymentMode: host-trusted
  imagePullSecrets:
    - dpf-pull-secret
  # Kamaji is permanently disabled - only Hypershift is supported
  kamajiClusterManager:
    disable: true
  #Openshift multus is used for DPU cluster 
  multus:
    disable: true
  cniInstaller:
    # Required from DPF 26.8+ (26.11): OVS and standard CNI plugins (ovs, rdma, dhcp, …)
    # are delivered by cni-installer onto overrides.dpuCNIBinPath (/var/lib/cni/bin on RHCOS).
    # Without it, Multus fails HBN/SFC pods with "failed to find plugin ovs".
    disable: false
  overrides:
    kubernetesAPIServerVIP: api.<CLUSTER_NAME>.<BASE_DOMAIN>
    kubernetesAPIServerPort: 6443
    dpuCNIBinPath: /var/lib/cni/bin/
    dpuCNIPath: /run/multus/cni/net.d/
    # Configure lib64 path for RHCOS systems
    dpuOpenvSwitchSystemSharedLib64Path: /lib64
    # Configure linker cache and opt library path for RHCOS systems
    dpuLinkerCachePath: /etc/ld.so.cache
    dpuOptLibraryPath: /usr/opt
    # When using OpenShift Multus (default), Flannel needs to install CNI config
    flannelSkipCNIConfigInstallation: false
  provisioningController:
    enableDynamicBFCFGTemplates: true
    hostAgentDNSPolicy: Default
    dmsTimeout: 900
  nodeSRIOVDevicePluginController:
    devicePlugin:
      defaultResourcePrefix: <SRIOV_DP_RESOURCE_PREFIX>
    disable: false
    replicas: 1
  staticClusterManager:
    disable: false
  <FLANNEL_CONFIG>
  networking:
    controlPlaneMTU: <NODES_MTU>
    highSpeedMTU: <NODES_MTU>
    dpuNodeOOBBridgeName: br-ex
  dpuServiceController:
    disableHostNetworkReadyNoExecuteTaints: false

