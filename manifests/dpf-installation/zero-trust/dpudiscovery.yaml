apiVersion: provisioning.dpu.nvidia.com/v1alpha1
kind: DPUDiscovery
metadata:
  name: <ZT_DPU_DISCOVERY_NAME>
  namespace: dpf-operator-system
spec:
  scanInterval: <ZT_DPU_DISCOVERY_SCAN_INTERVAL>
  workers: 25
  ipRangeSpec:
    ipRange:
      startIP: <ZT_DPU_BMC_IP_RANGE_START>
      endIP: <ZT_DPU_BMC_IP_RANGE_END>
